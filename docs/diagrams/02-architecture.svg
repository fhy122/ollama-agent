<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 532" width="100%" role="img">
<title>ollama-agent 架构分层</title>
<desc>六层自上而下：入口层、前端交互层、编排层、协议与事件层、基础层、能力层，上层依赖下层，下层不反向依赖。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="532" fill="#FFFFFF"/>
<text x="640" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#888780" text-anchor="end" dominant-baseline="central">依赖方向 ↓ 上层可依赖下层，下层绝不反向</text>

<rect x="40" y="30" width="600" height="62" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="51" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#633806" dominant-baseline="central">入口层 · 三个等价入口</text>
<text x="56" y="73" font-family="ui-monospace, monospace" font-size="11" fill="#854F0B" dominant-baseline="central">ollama_agent.py · agent/__main__.py · webui/__main__.py</text>

<rect x="40" y="114" width="600" height="62" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="135" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">前端 / 交互层 · 两个壳，同一套事件语义</text>
<text x="56" y="157" font-family="ui-monospace, monospace" font-size="11" fill="#534AB7" dominant-baseline="central">cli.py + palette.py（终端）   ·   server.py + session.py + stream.py + static/（网页）</text>

<rect x="40" y="198" width="600" height="62" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="219" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">编排层 · 全项目只有一个</text>
<text x="56" y="241" font-family="ui-monospace, monospace" font-size="11" fill="#185FA5" dominant-baseline="central">loop.run_turn：模型 ↔ 工具 ↔ 历史，最多 max_steps（12）步，事件统一走 emitter</text>

<rect x="40" y="282" width="600" height="62" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="303" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">协议与事件层 · 与外部世界的唯一接口</text>
<text x="56" y="325" font-family="ui-monospace, monospace" font-size="11" fill="#0F6E56" dominant-baseline="central">client.py（/api/chat 流式）   ·   events.py（ConsoleEmitter）   ·   stream.py（NDJSON）</text>

<rect x="40" y="366" width="600" height="62" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="387" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">基础层 · 谁都不反向依赖它</text>
<text x="56" y="409" font-family="ui-monospace, monospace" font-size="11" fill="#5F5E5A" dominant-baseline="central">config.py（默认值 + 系统提示词）   ·   registry.py（工具契约 + 注册表）   ·   console.py</text>

<rect x="40" y="450" width="600" height="62" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="56" y="471" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#173404" dominant-baseline="central">能力层 · 只有"怎么做"，没有"什么时候做"</text>
<text x="56" y="493" font-family="ui-monospace, monospace" font-size="11" fill="#3B6D11" dominant-baseline="central">tools/*.py（15）   ·   docgen + docparse（Office 读写）   ·   clipboard + hotkeys（Win32）</text>

<path d="M612 92 L612 112" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M612 176 L612 196" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M612 260 L612 280" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M612 344 L612 364" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M612 428 L612 448" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
