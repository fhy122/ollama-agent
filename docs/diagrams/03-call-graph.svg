<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 368" width="100%" role="img">
<title>模块调用关系</title>
<desc>CLI 与 WebUI 两条路径汇合到同一个 run_turn，再由 run_turn 调用 client.chat、tools.dispatch 与 emitter，最终触达 Ollama、具体工具与输出端。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="368" fill="#FFFFFF"/>

<rect x="60" y="40" width="250" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="185" y="60" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">CLI：cli.py</text>
<text x="185" y="78" font-family="system-ui, sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">REPL · 斜杠命令 · @ 引用</text>

<rect x="370" y="40" width="250" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="495" y="60" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">WebUI：server → session</text>
<text x="495" y="78" font-family="system-ui, sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">HTTP · 锁串行 · 确认闸</text>

<path d="M185 96 L300 122" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M495 96 L380 122" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="190" y="124" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="144" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">run_turn · loop.py</text>
<text x="340" y="162" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">唯一编排点：模型 ↔ 工具 ↔ 历史</text>

