<text x="340" y="316" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">文件 / 命令 / 浏览器</text>

<rect x="450" y="292" width="180" height="48" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="540" y="316" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">终端刷字 / 网页渲染</text>

<text x="340" y="350" font-family="system-ui, sans-serif" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">两条入口路径在这里汇合，run_turn 之下不再区分前端</text>
