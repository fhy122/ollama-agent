<path d="M380 180 L525 206" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="50" y="208" width="180" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="228" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">client.chat</text>
<text x="140" y="246" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">流式 /api/chat</text>

<rect x="250" y="208" width="180" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
